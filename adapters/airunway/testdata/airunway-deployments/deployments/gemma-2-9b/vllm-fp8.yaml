{
  "apiVersion": "airunway.ai/v1alpha1",
  "kind": "ModelDeployment",
  "metadata": {
    "name": "gemma-2-9b-vllm-fp8",
    "annotations": {
      "neocloud.io/required-provider": "vllm"
    }
  },
  "spec": {
    "model": {
      "id": "RedHatAI/gemma-2-9b-it-FP8",
      "source": "huggingface"
    },
    "provider": {
      "name": "vllm"
    },
    "engine": {
      "type": "vllm",
      "image": "vllm/vllm-openai:v0.31.0",
      "contextLength": 8192
    },
    "resources": {
      "gpu": {
        "count": 1
      }
    },
    "secrets": {
      "huggingFaceToken": "hf-token-secret"
    }
  }
}
