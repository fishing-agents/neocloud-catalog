{
  "apiVersion": "airunway.ai/v1alpha1",
  "kind": "ModelDeployment",
  "metadata": {
    "name": "llama-3-1-70b-vllm-fp8",
    "annotations": {
      "neocloud.io/required-provider": "vllm"
    }
  },
  "spec": {
    "model": {
      "id": "RedHatAI/Meta-Llama-3.1-70B-Instruct-FP8",
      "source": "huggingface"
    },
    "provider": {
      "name": "vllm"
    },
    "engine": {
      "type": "vllm",
      "image": "vllm/vllm-openai:v0.31.0",
      "contextLength": 8192,
      "args": {
        "enable-auto-tool-choice": "",
        "tool-call-parser": "llama3_json"
      }
    },
    "resources": {
      "gpu": {
        "count": 2
      }
    },
    "secrets": {
      "huggingFaceToken": "hf-token-secret"
    }
  }
}
