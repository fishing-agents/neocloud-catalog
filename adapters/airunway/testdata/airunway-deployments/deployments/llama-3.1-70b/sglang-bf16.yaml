{
  "apiVersion": "airunway.ai/v1alpha1",
  "kind": "ModelDeployment",
  "metadata": {
    "name": "llama-3-1-70b-sglang-bf16",
    "annotations": {
      "neocloud.io/required-provider": "dynamo"
    }
  },
  "spec": {
    "model": {
      "id": "meta-llama/Llama-3.1-70B-Instruct",
      "source": "huggingface"
    },
    "provider": {
      "name": "dynamo"
    },
    "engine": {
      "type": "sglang",
      "contextLength": 8192,
      "args": {
        "tool-call-parser": "llama3",
        "tp-size": "2"
      }
    },
    "resources": {
      "gpu": {
        "count": 2
      }
    },
    "secrets": {
      "huggingFaceToken": "hf-token-secret"
    }
  }
}
