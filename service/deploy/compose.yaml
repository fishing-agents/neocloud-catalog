name: catalog-test

x-service: &service
  build: {context: ../.., dockerfile: service/Dockerfile}
  image: catalog-service:deploy
  command: [serve]
  volumes: ["./keys:/keys:ro"]

x-migrate: &migrate
  image: arigaio/atlas:1.3.3-community-distroless@sha256:9c9958f5b8d26d404ab2e28098c8629526eb4bec647f790278611e58a0b19839
  volumes: ["../migrations:/migrations:ro"]
  depends_on: {postgres: {condition: service_healthy}}

services:
  postgres:
    image: postgres:16@sha256:1a6ab3f5345eb6dbe04a1349529caabdb0ab09293a09590fad07b2246bfa4b54
    environment: {POSTGRES_USER: catalog, POSTGRES_PASSWORD: catalog}
    volumes:
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql:ro
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: [CMD, pg_isready, -U, catalog, -d, catalog_operator]
      interval: 2s
      retries: 30

  registry:
    image: ghcr.io/project-zot/zot:v2.1.21@sha256:6b69512c00dceaad05b1144e6079aac6aa7309d7fd200f9947ecb1de09cf48c8
    ports: ["15000:5000"]

  migrate-upstream:
    <<: *migrate
    command: [migrate, apply, --dir, "file:///migrations", --url, "postgres://catalog:catalog@postgres:5432/catalog_upstream?sslmode=disable"]

  migrate-operator:
    <<: *migrate
    command: [migrate, apply, --dir, "file:///migrations", --url, "postgres://catalog:catalog@postgres:5432/catalog_operator?sslmode=disable"]

  upstream:
    <<: *service
    ports: ["18080:8080", "18081:8081"]
    environment:
      NEOCLOUD_CATALOG_DATABASE_DSN: postgres://catalog:catalog@postgres:5432/catalog_upstream?sslmode=disable
      NEOCLOUD_CATALOG_RELEASE_REF: registry:5000/neocloud/catalog:v4
      NEOCLOUD_CATALOG_RELEASE_PLAIN_HTTP: "true"
      NEOCLOUD_CATALOG_RELEASE_KEY: /keys/cosign.key
      COSIGN_PASSWORD: ${COSIGN_PASSWORD:-}
    depends_on:
      migrate-upstream: {condition: service_completed_successfully}
      registry: {condition: service_started}

  operator:
    <<: *service
    ports: ["18180:8080", "18181:8081"]
    environment:
      NEOCLOUD_CATALOG_DATABASE_DSN: postgres://catalog:catalog@postgres:5432/catalog_operator?sslmode=disable
      NEOCLOUD_CATALOG_UPSTREAM_REF: registry:5000/neocloud/catalog:v4
      NEOCLOUD_CATALOG_UPSTREAM_PUBLIC_KEY: /keys/cosign.pub
      NEOCLOUD_CATALOG_UPSTREAM_PLAIN_HTTP: "true"
    depends_on:
      migrate-operator: {condition: service_completed_successfully}
      registry: {condition: service_started}

volumes:
  pgdata:
