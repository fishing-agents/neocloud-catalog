replicaCount: 1

# Built from service/Dockerfile (context: repository root); carries the binary,
# data/ and the migrations.
image:
  repository: catalog-service
  tag: latest
  # Optional sha256 digest pinning the Deployment's image and the migrate Job's mount.
  digest: ""
  pullPolicy: IfNotPresent

# Pull secrets for the Deployment and the migrate Job (which mounts the service
# image), e.g. [{name: catalog-registry}].
imagePullSecrets: []

service:
  port: 8080
  metricsPort: 8081

serviceMonitor:
  enabled: false

resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    cpu: "1"
    memory: 1Gi

# Postgres DSN from a Secret, never a value (env NEOCLOUD_CATALOG_DATABASE_DSN).
database:
  dsnSecretName: catalog-service-db
  dsnSecretKey: dsn

# TOML over the service defaults (service/internal/config/defaults.toml). The
# chart sets listen addresses, bootstrap.data_dir and the paths of the files
# it mounts. Never put a secret here. Setting upstream.ref makes an operator
# deployment (see the README).
config: {}
#  auth:
#    issuer_url: https://icp.example.com
#    audience: neocloud-catalog
#  jobs:
#    job_timeout: 30m
#    rescue_after: 1h
#  release:
#    ref: registry.example.com/org/neocloud-catalog:v4
#    overlay_ref: registry.example.com/org/neocloud-catalog-overlay:v4
#    publish_timeout: 2m
#  upstream:
#    ref: ghcr.io/fishing-agents/neocloud-catalog:v4
#    identity_issuer: https://token.actions.githubusercontent.com
#    identity: '^https://github\.com/fishing-agents/neocloud-catalog/\.github/workflows/release\.yml@refs/tags/v.*$'

# Secret from `cosign generate-key-pair k8s://<namespace>/<name>` (cosign.key,
# cosign.password) signing what the API publishes. Required with config.release.ref.
signing:
  secretName: ""

# Secret with the Hugging Face token for gated repositories, read once at
# startup; in an operator deployment the token of model imports.
huggingface:
  tokenSecretName: ""
  tokenSecretKey: token

# Secret whose key holds the webhook subscribers as TOML, loaded after config:
#   [[webhooks.subscribers]]
#   url = "https://neocloud-api.example/v1/catalog/webhooks"
#   secret = "<HMAC key>"
# Empty: no webhooks.
webhooks:
  secretName: ""
  secretKey: webhooks.toml

# dockerconfigjson Secret for pushing releases and pulling a private upstream.
# Empty: anonymous pulls, no push.
registryAuth:
  secretName: ""

# Trust files for config.upstream (refused without config.upstream.ref):
# cosign public keys replacing the keyless identities, and a Sigstore
# trusted_root.json for air-gapped keyless verification.
upstreamTrust:
  publicKey: ""
  overlayPublicKey: ""
  trustedRoot: ""

# pre-install/pre-upgrade hook: Atlas applies the image's versioned migrations.
migrate:
  image:
    repository: arigaio/atlas
    tag: 1.3.3-community-distroless
    digest: sha256:9c9958f5b8d26d404ab2e28098c8629526eb4bec647f790278611e58a0b19839
    pullPolicy: IfNotPresent
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 500m
      memory: 256Mi
