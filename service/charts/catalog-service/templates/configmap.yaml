{{- $trust := .Values.upstreamTrust -}}
{{- if and (or $trust.publicKey $trust.overlayPublicKey $trust.trustedRoot) (not (.Values.config.upstream | default dict).ref) -}}
{{- fail "upstreamTrust.* needs config.upstream.ref: the trust material verifies the upstream release" -}}
{{- end -}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "catalog-service.fullname" . }}
  labels:
    {{- include "catalog-service.labels" . | nindent 4 }}
data:
  config.toml: |
    {{- include "catalog-service.config" . | nindent 4 }}
  {{- with .Values.upstreamTrust.publicKey }}
  upstream-public-key.pem: |
    {{- . | nindent 4 }}
  {{- end }}
  {{- with .Values.upstreamTrust.overlayPublicKey }}
  upstream-overlay-public-key.pem: |
    {{- . | nindent 4 }}
  {{- end }}
  {{- with .Values.upstreamTrust.trustedRoot }}
  upstream-trusted-root.json: |
    {{- . | nindent 4 }}
  {{- end }}
