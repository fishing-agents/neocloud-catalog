{{- $image := include "catalog-service.image" . -}}
{{- $hook := dict "helm.sh/hook" "pre-install,pre-upgrade" "helm.sh/hook-delete-policy" "before-hook-creation,hook-succeeded" -}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "catalog-service.fullname" . }}-migrate
  labels:
    {{- include "catalog-service.labels" . | nindent 4 }}
  annotations:
    {{- toYaml $hook | nindent 4 }}
    helm.sh/hook-weight: "-1"
data:
  # The DSN stays in the environment: getenv keeps it out of the argv.
  atlas.hcl: |
    env "catalog" {
      url = getenv("NEOCLOUD_CATALOG_DATABASE_DSN")
      migration {
        dir = "file:///catalog/migrations"
      }
    }
---
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "catalog-service.fullname" . }}-migrate
  labels:
    {{- include "catalog-service.labels" . | nindent 4 }}
  annotations:
    {{- toYaml $hook | nindent 4 }}
    helm.sh/hook-weight: "0"
spec:
  backoffLimit: 0
  template:
    metadata:
      labels:
        app: {{ include "catalog-service.name" . }}-migrate
    spec:
      restartPolicy: Never
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- include "catalog-service.podSecurityContext" . | nindent 8 }}
      containers:
        - name: migrate
          image: "{{ .Values.migrate.image.repository }}:{{ .Values.migrate.image.tag }}{{ with .Values.migrate.image.digest }}@{{ . }}{{ end }}"
          imagePullPolicy: {{ .Values.migrate.image.pullPolicy }}
          args: ["migrate", "apply", "--config", "file:///etc/atlas/atlas.hcl", "--env", "catalog"]
          env:
            {{- include "catalog-service.dsnEnv" . | nindent 12 }}
          volumeMounts:
            - name: atlas
              mountPath: /etc/atlas
              readOnly: true
            - name: catalog
              mountPath: /catalog
              readOnly: true
          securityContext:
            {{- include "catalog-service.securityContext" . | nindent 12 }}
          resources:
            {{- toYaml .Values.migrate.resources | nindent 12 }}
      volumes:
        - name: atlas
          configMap:
            name: {{ include "catalog-service.fullname" . }}-migrate
        # The service image, so the migrations match this release's binary.
        - name: catalog
          image:
            reference: {{ $image | quote }}
            pullPolicy: {{ .Values.image.pullPolicy }}
