[server]
addr = "0.0.0.0:8080"
read_timeout = "15s"
write_timeout = "15s"

[database]
dsn = "postgres://neocloud:neocloud@localhost:5432/neocloud_catalog?sslmode=disable"
max_conns = 20

[telemetry]
metrics_addr = "0.0.0.0:8081"

[bootstrap]
data_dir = "../data"

[huggingface]
# Path to the token (a mounted secret), read once at startup. Empty: gated
# sources are reported as "gated: token missing".
token_file = ""

[azure_prices]
# ARM regions for azure/ node type prices. eastus2 because ND MI300X v5 is not
# offered in eastus; a node type priced in none is a run error.
regions = ["eastus", "eastus2"]

[auth]
# API keys always work. issuer_url also accepts OIDC JWTs whose aud contains
# audience; writing needs the admin role.
issuer_url = ""
audience = ""

[jobs]
# job_timeout cancels a run (jobs are never retried); a run still running after
# rescue_after (> job_timeout) was left by an exited worker and is failed.
job_timeout = "30m"
rescue_after = "1h"

[release]
# POST /v1/releases/{version}/publish pushes to ref (repository:tag), signed
# with key (password in COSIGN_PASSWORD). Empty: the API does not publish.
# overlay_ref also publishes the release's overlay, signed with the same key.
ref = ""
key = ""
overlay_ref = ""
publish_timeout = "2m"
# plain_http pushes to a registry without TLS.
plain_http = false

[upstream]
# Operator deployments: import our signed release from ref, verified by
# public_key or by identity_issuer + identity (keyless regexp). overlay_ref
# imports the pinned overlay with its own overlay_* trust. trusted_root enables
# offline keyless verification; plain_http allows a registry without TLS.
# Registry auth comes from the docker keychain. With ref set, bootstrap-from-json,
# epoch and huggingface are refused.
ref = ""
identity_issuer = ""
identity = ""
public_key = ""
overlay_ref = ""
overlay_identity_issuer = ""
overlay_identity = ""
overlay_public_key = ""
trusted_root = ""
plain_http = false
