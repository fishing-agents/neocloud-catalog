openapi: 3.0.3
info:
  title: neocloud catalog service API
  version: 0.1.0
  description: |
    The catalog service's operator API; catalog objects have the schema 4 export shapes.

    Every /v1 operation needs a bearer token: an API key (neocatalog_<prefix>_<secret>)
    or, when auth.issuer_url is set, an OIDC JWT whose aud contains auth.audience.
    GET takes any principal; other methods need an API key or the admin role.

    Prices and cost estimates are internal: no release carries them.
servers:
  - url: /
security:
  - bearerAuth: []
paths:
  /v1/catalog:
    get:
      operationId: getCatalog
      summary: The effective catalog
      description: Per key the local object, else the upstream one, in curated order, without generator-derived fields (version, generated_at, fits, deployment; kv_bytes_per_token is 0) or extension payloads.
      parameters:
        - name: provenance
          in: query
          description: add the provenance of every object
          schema:
            type: boolean
      responses:
        "200":
          description: the effective catalog
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EffectiveCatalog"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /v1/local/models/{slug}:
    parameters:
      - name: slug
        in: path
        required: true
        schema:
          type: string
    get:
      operationId: getLocalModel
      summary: The local model of slug
      responses:
        "200":
          description: the local model
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ModelTemplate"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
        "404":
          $ref: "#/components/responses/NotFound"
    put:
      operationId: putLocalModel
      summary: Curate the local model of slug
      description: Replaces the local model of slug as a whole (quantizations, sources and presets included), overriding the upstream one; derived fields are not stored and extension payloads are refused.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ModelTemplate"
      responses:
        "200":
          description: the stored local model
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ModelTemplate"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
        "403":
          $ref: "#/components/responses/Forbidden"
    delete:
      operationId: deleteLocalModel
      summary: Remove the local model of slug, which restores the upstream one
      responses:
        "204":
          description: removed
        "401":
          $ref: "#/components/responses/Unauthorized"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /v1/local/models/{slug}/presets/{name}:
    parameters:
      - name: slug
        in: path
        required: true
        schema:
          type: string
      - name: name
        in: path
        required: true
        schema:
          type: string
    get:
      operationId: getLocalPreset
      summary: A preset of the local model of slug
      responses:
        "200":
          description: the preset
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Preset"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
        "404":
          $ref: "#/components/responses/NotFound"
    put:
      operationId: putLocalPreset
      summary: Curate a preset of the local model of slug
      description: Replaces or appends the preset in the existing local model of slug (PUT the model first to override an upstream one); extension payloads are refused.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Preset"
      responses:
        "200":
          description: the stored preset
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Preset"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      operationId: deleteLocalPreset
      summary: Remove a preset from the local model of slug
      responses:
        "204":
          description: removed
        "401":
          $ref: "#/components/responses/Unauthorized"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /v1/local/node-types/{id}:
    parameters:
      - name: id
        in: path
        required: true
        description: the node type id; escape its slash (azure%2FStandard_ND96isr_H100_v5)
        schema:
          type: string
    get:
      operationId: getLocalNodeType
      summary: The local node type of id
      responses:
        "200":
          description: the local node type
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NodeType"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
        "404":
          $ref: "#/components/responses/NotFound"
    put:
      operationId: putLocalNodeType
      summary: Curate the local node type of id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NodeType"
      responses:
        "200":
          description: the stored local node type
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NodeType"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
        "403":
          $ref: "#/components/responses/Forbidden"
    delete:
      operationId: deleteLocalNodeType
      summary: Remove the local node type of id, which restores the upstream one
      responses:
        "204":
          description: removed
        "401":
          $ref: "#/components/responses/Unauthorized"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /v1/local/prices:
    get:
      operationId: listLocalPrices
      summary: The local node type prices (internal)
      responses:
        "200":
          description: the local prices by node type, region and billing
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Price"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
    put:
      operationId: putLocalPrices
      summary: Replace the local node type prices (internal)
      description: The local layer then holds exactly these prices; an unchanged price keeps its as_of.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: "#/components/schemas/Price"
      responses:
        "200":
          description: the stored local prices
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Price"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
        "403":
          $ref: "#/components/responses/Forbidden"
    delete:
      operationId: deleteLocalPrices
      summary: Remove every local node type price (internal)
      responses:
        "204":
          description: removed
        "401":
          $ref: "#/components/responses/Unauthorized"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
        "403":
          $ref: "#/components/responses/Forbidden"
  /v1/imports:
    get:
      operationId: listImports
      summary: Import runs, newest first, after the queued ones
      parameters:
        - name: importer
          in: query
          schema:
            type: string
        - name: limit
          in: query
          description: the most recorded runs to list
          schema:
            type: integer
            minimum: 1
            maximum: 1000
            default: 100
      responses:
        "200":
          description: import runs
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ImportRun"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
    post:
      operationId: startImport
      summary: Queue a run of an importer
      description: Enqueues the importer and returns the queued run; an operator deployment (upstream.ref set) refuses bootstrap-from-json, epoch and huggingface with 409.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ImportCreate"
      responses:
        "202":
          description: the queued run
          headers:
            Location:
              description: the run
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ImportRun"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
  /v1/imports/{id}:
    get:
      operationId: getImport
      summary: The import run id
      parameters:
        - name: id
          in: path
          required: true
          description: the import run's id
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: the import run
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ImportRun"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
        "404":
          $ref: "#/components/responses/NotFound"
  /v1/generator-runs:
    post:
      operationId: startGeneratorRun
      summary: Queue a generator run over the effective catalog
      responses:
        "202":
          description: the queued run
          headers:
            Location:
              description: the run
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GeneratorRun"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
        "403":
          $ref: "#/components/responses/Forbidden"
  /v1/generator-runs/{id}:
    get:
      operationId: getGeneratorRun
      summary: The generator run id
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: the generator run
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GeneratorRun"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
        "404":
          $ref: "#/components/responses/NotFound"
  /v1/releases:
    get:
      operationId: listReleases
      summary: Releases, newest first
      responses:
        "200":
          description: releases
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Release"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
    post:
      operationId: createRelease
      summary: Freeze a succeeded generator run as a release
      description: The release is versioned by the run's generation time and pins the current overlay to its digest.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReleaseCreate"
      responses:
        "201":
          description: the release
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Release"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
  /v1/releases/{version}/publish:
    post:
      operationId: publishRelease
      summary: Publish a release to release.ref, signed with release.key
      description: Pushes the signed snapshot to release.ref (and with release.overlay_ref the overlay pinned to it); republishing identical content is a no-op and a release older than a published one is refused.
      parameters:
        - name: version
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: the published release
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Release"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "503":
          description: publishing is not configured (release.ref, release.key), or authentication is unavailable (with Retry-After)
          headers:
            Retry-After:
              description: seconds, when authentication is unavailable
              schema:
                type: integer
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /v1/cost-estimates:
    get:
      operationId: listCostEstimates
      summary: Cost estimates of the newest succeeded generator run (internal)
      parameters:
        - name: model
          in: query
          schema:
            type: string
        - name: billing
          in: query
          schema:
            $ref: "#/components/schemas/Billing"
        - name: region
          in: query
          schema:
            type: string
      responses:
        "200":
          description: cost estimates
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CostEstimate"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
  responses:
    BadRequest:
      description: invalid request
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Unauthorized:
      description: no valid bearer token
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Forbidden:
      description: the principal may only read (an OIDC token without the admin role)
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    NotFound:
      description: no such object
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    ServiceUnavailable:
      description: authentication is unavailable (database or OIDC issuer failed); retry after Retry-After
      headers:
        Retry-After:
          description: seconds
          schema:
            type: integer
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Conflict:
      description: the request conflicts with the current state
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
  schemas:
    Error:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
          description: stable, machine-readable (invalid_request, unauthorized, forbidden, not_found, conflict, not_configured, auth_unavailable, internal_error)
        message:
          type: string
    Layer:
      type: string
      enum: [upstream, local, overlay]
    Billing:
      type: string
      enum: [on_demand, spot, reserved_1y]
    RunStatus:
      type: string
      description: queued until a worker starts the run
      enum: [queued, running, succeeded, failed]
    EffectiveCatalog:
      type: object
      required: [schema_version, families, node_types, models, draft_models, backends]
      properties:
        schema_version:
          type: string
        families:
          type: array
          items:
            $ref: "#/components/schemas/Family"
        node_types:
          type: array
          items:
            $ref: "#/components/schemas/NodeType"
        models:
          type: array
          items:
            $ref: "#/components/schemas/ModelTemplate"
        draft_models:
          type: array
          items:
            $ref: "#/components/schemas/DraftModel"
        backends:
          type: array
          items:
            $ref: "#/components/schemas/Backend"
        provenance:
          $ref: "#/components/schemas/CatalogProvenance"
    CatalogProvenance:
      type: object
      description: Per object kind and key (a quantization's is <model slug>/<name>) the object's local and upstream rows, local first.
      required: [families, node_types, models, quantizations, draft_models, backends]
      properties:
        families:
          $ref: "#/components/schemas/ProvenanceByKey"
        node_types:
          $ref: "#/components/schemas/ProvenanceByKey"
        models:
          $ref: "#/components/schemas/ProvenanceByKey"
        quantizations:
          $ref: "#/components/schemas/ProvenanceByKey"
        draft_models:
          $ref: "#/components/schemas/ProvenanceByKey"
        backends:
          $ref: "#/components/schemas/ProvenanceByKey"
    ProvenanceByKey:
      type: object
      additionalProperties:
        type: array
        items:
          $ref: "#/components/schemas/Provenance"
    Provenance:
      type: object
      required: [layer, source, source_url, as_of, effective]
      description: Where one layer's row of an object came from; effective marks the row the effective catalog uses.
      properties:
        layer:
          $ref: "#/components/schemas/Layer"
        source:
          type: string
          description: the importer's source, or curation
        source_url:
          type: string
        as_of:
          type: string
          format: date-time
        import_run_id:
          type: string
          format: uuid
        effective:
          type: boolean
        fields:
          x-go-type-skip-optional-pointer: true
          type: object
          description: per field, where its value came from (not kept for backends)
          additionalProperties:
            $ref: "#/components/schemas/FieldSource"
    FieldSource:
      x-go-type: model.FieldSource
      x-go-type-import:
        name: model
        path: github.com/fishman/neocloud-catalog/service/internal/model
      type: object
      required: [source, as_of]
      properties:
        source:
          type: string
        source_url:
          type: string
        as_of:
          type: string
          format: date-time
        import_run_id:
          type: string
          format: uuid
    Price:
      type: object
      required: [node_type_id, region, billing, usd_per_hour]
      description: What a node type costs per hour in a region at a billing type.
      properties:
        node_type_id:
          type: string
        region:
          type: string
        billing:
          $ref: "#/components/schemas/Billing"
        usd_per_hour:
          type: number
          format: double
          minimum: 0
        as_of:
          type: string
          format: date-time
          readOnly: true
    ImportRun:
      type: object
      required: [id, importer, layer, source, source_url, status, input_version, summary, error]
      properties:
        id:
          type: string
          format: uuid
        importer:
          type: string
        layer:
          $ref: "#/components/schemas/Layer"
        source:
          type: string
        source_url:
          type: string
        status:
          $ref: "#/components/schemas/RunStatus"
        input_version:
          type: string
          description: the version of the input it read
        started_at:
          type: string
          format: date-time
        finished_at:
          type: string
          format: date-time
        summary:
          $ref: "#/components/schemas/ImportSummary"
        error:
          type: string
    ImportSummary:
      type: object
      description: >-
        the importer's result: rows changed per table, imported values kept
        behind curated ones (for kaito, catalog values KAITO disagrees with),
        unreadable input, and source counts. A succeeded run may list errors.
      required: [changes]
      properties:
        changes:
          type: object
          additionalProperties:
            $ref: "#/components/schemas/Change"
        conflicts:
          type: array
          items:
            $ref: "#/components/schemas/ImportConflict"
        errors:
          type: array
          items:
            type: string
        sources:
          type: object
          required: [read, failed]
          properties:
            read:
              type: integer
            failed:
              type: integer
      additionalProperties: true
    ImportConflict:
      x-go-type: store.Conflict
      x-go-type-import:
        name: store
        path: github.com/fishman/neocloud-catalog/service/internal/store
      type: object
      description: >-
        a curated value kept over an imported one; field is a column or
        files/<path> (null where a side lacks the file). For kaito, curated is
        the catalog's value and imported KAITO's.
      required: [kind, key, field, curated, imported]
      properties:
        kind:
          type: string
        key:
          type: string
        field:
          type: string
        curated: {}
        imported: {}
    Change:
      x-go-type: store.Change
      x-go-type-import:
        name: store
        path: github.com/fishman/neocloud-catalog/service/internal/store
      type: object
      properties:
        inserted:
          type: integer
        updated:
          type: integer
        deleted:
          type: integer
    GeneratorRun:
      type: object
      required: [id, status, input_digest, input_import_runs, schema_version, report, error]
      properties:
        id:
          type: string
          format: uuid
        status:
          $ref: "#/components/schemas/RunStatus"
        started_at:
          type: string
          format: date-time
        finished_at:
          type: string
          format: date-time
        input_digest:
          type: string
          description: sha256 of its snapshot's curated inputs, excluding prices (cost estimates carry their own price_source)
        input_import_runs:
          type: array
          description: the import runs that wrote its snapshot's inputs, excluding prices (cost estimates carry their own price_source)
          items:
            type: string
            format: uuid
        schema_version:
          type: string
        report:
          type: array
          description: what the generator reported
          items:
            type: string
        error:
          type: string
    ImportCreate:
      type: object
      required: [importer]
      properties:
        importer:
          type: string
          description: bootstrap-from-json, epoch, huggingface, azure-prices or kaito; with upstream.ref set, upstream, azure-prices or kaito
    ReleaseCreate:
      type: object
      required: [generator_run]
      properties:
        generator_run:
          type: string
          format: uuid
    Release:
      type: object
      required: [id, version, digest, schema_version, generator_run, created_at]
      properties:
        id:
          type: string
          format: uuid
        version:
          type: string
          description: the generation time of its generator run
        digest:
          type: string
          description: the digest of its public snapshot
        schema_version:
          type: string
        generator_run:
          type: string
          format: uuid
        artifact_ref:
          x-go-type-skip-optional-pointer: true
          type: string
          description: repository@digest it was published as
        overlay_ref:
          x-go-type-skip-optional-pointer: true
          type: string
          description: repository@digest its overlay was published as (release.overlay_ref), possibly by a later publish
        published_at:
          type: string
          format: date-time
        created_at:
          type: string
          format: date-time
    CostEstimate:
      type: object
